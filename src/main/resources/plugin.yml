name: ExplosionNerf
version: 1.4.0
main: com.speedsmp.explosionnerf.ExplosionNerfPlugin
api-version: '1.21'
folia-supported: true
description: Nerfs end crystal and respawn anchor explosion damage without cancelling explosions.
commands:
  explosionnerf:
    description: Reload ExplosionNerf configuration.
    usage: /explosionnerf reload
    permission: explosionnerf.reload
permissions:
  explosionnerf.reload:
    description: Allows reloading ExplosionNerf configuration.
    default: op
